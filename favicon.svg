<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Li">
  <!-- The masthead's lithium tile, reduced to what survives at 16px: the
       rounded square and the symbol. The atomic number and weight are dropped,
       because at favicon size they turn to mud and blunt the one legible mark. -->
  <rect width="64" height="64" rx="12" fill="#f2efe2"/>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#183152" stroke-width="3"/>
  <text x="32" y="46" text-anchor="middle" fill="#183152"
        font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="38" font-weight="500" letter-spacing="-1">Li</text>
</svg>
